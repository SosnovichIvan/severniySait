<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Информационный портал: медиа, подразделения и календарь событий Северного человека."
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preload" as="image" href="/logo.png" />
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 28px;
        background: #101513;
        color: #f0f2e9;
        font:
          11px Arial,
          sans-serif;
        letter-spacing: 2px;
      }
      #boot-splash img {
        width: 190px;
        height: 210px;
        object-fit: contain;
        animation: boot-breathe 1.8s ease-in-out infinite;
      }
      .boot-track {
        width: 130px;
        height: 2px;
        background: #344239;
        overflow: hidden;
      }
      .boot-track:after {
        content: "";
        display: block;
        width: 50%;
        height: 100%;
        background: #b9d9a0;
        animation: boot-progress 1.2s ease-in-out infinite;
      }
      @keyframes boot-breathe {
        50% {
          opacity: 0.6;
          transform: scale(0.97);
        }
      }
      @keyframes boot-progress {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(300%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash img,
        .boot-track:after {
          animation: none;
        }
      }
    </style>
    <title>Северный человек — информационный портал</title>
  </head>
  <body>
    <div
      id="boot-splash"
      role="status"
      aria-live="polite"
      aria-label="Загрузка сайта Северный человек"
    >
      <img
        src="/logo.png"
        width="190"
        height="210"
        alt="Логотип Северный человек"
      /><span>ЗАГРУЖАЕМ ПРОСТРАНСТВО</span
      ><span class="boot-track" aria-hidden="true"></span>
    </div>
    <noscript
      ><style>
        #boot-splash {
          display: none;
        }
      </style>
      <p>Для работы сайта включите JavaScript в браузере.</p></noscript
    >
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
